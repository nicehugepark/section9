<!doctype html>
<!-- REQ-20260915-062-62x6 검증 하니스 (same-origin 보조 페이지):
     휴지통 판의 **검색 칸과 거르개를 실제로 눌러·쳐 본다.**

     캡처 한 장은 그 순간의 정지 화면이라, 친 글자마다 목록이 좁아지는지·
     거르개가 갈라 내는지·걸러서 0 이 된 자리에 푸는 손이 서는지는 못 잡는다.
     여기서는 실제 KeyboardEvent 와 MouseEvent 를 던져 그 셋을 본다. -->
<html><head><meta charset="utf-8"><title>verify trash sieve</title>
<style>
 html,body{margin:0;background:#111;color:#eee;font:13px/1.6 ui-monospace,monospace}
 #out{padding:10px 14px;white-space:pre-wrap;font-size:14px}
 .ok{color:#55c07a} .bad{color:#e06c5d} .hi{color:#d9b13b} .dim{color:#8b8f96}
 iframe{border:0;width:1400px;height:820px;background:#000}
</style>
</head><body>
<div id="out">초기화…</div>
<iframe id="f" src="/#board"></iframe>
<script>
const out = document.getElementById("out");
const lines = [];
const say = (s, cls) => { lines.push(cls ? `<span class="${cls}">${s}</span>` : s);
                          out.innerHTML = lines.join("\n"); };
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const wait = (fn, ms=20000, what="") => new Promise((res, rej) => {
  const t0 = Date.now();
  const t = setInterval(() => {
    let v = null;
    try{ v = fn(); }catch(e){}
    if (v){ clearInterval(t); res(v); }
    else if (Date.now() - t0 > ms){ clearInterval(t); rej(new Error("timeout: " + what)); }
  }, 120);
});
const sleep = ms => new Promise(s => setTimeout(s, ms));
const verdicts = [];
const check = (name, pass, detail) => {
  verdicts.push({name, pass});
  say(`  ${pass ? "✓" : "✗"} ${esc(name)}${detail ? "  — " + esc(detail) : ""}`,
      pass ? "ok" : "bad");
};

const f = document.getElementById("f");
let loads = 0;
f.addEventListener("load", () => { loads++; if (loads === 1) run(); });

// 사람의 손가락이 닿는 것은 그 좌표의 **맨 위 요소**다.
function realClick(win, doc, el){
  const r = el.getBoundingClientRect();
  const cx = Math.round(r.left + r.width / 2), cy = Math.round(r.top + r.height / 2);
  const top = doc.elementFromPoint(cx, cy) || el;
  const mk = t => new win.MouseEvent(t, {bubbles: true, cancelable: true, view: win,
                                         clientX: cx, clientY: cy, button: 0});
  top.dispatchEvent(mk("mousedown"));
  top.dispatchEvent(mk("mouseup"));
  top.dispatchEvent(mk("click"));
  return top;
}

// 글자를 **한 자씩** 친다 — 한 번에 넣으면 다시 그리는 사이 칸을 놓치는
// 결함(커서가 튀어 두 글자를 못 치는 것)이 드러나지 않는다.
async function type(win, doc, text){
  for (const ch of text){
    const box = doc.querySelector(".tidypanel .tq");
    if (!box) throw new Error("검색 칸이 사라졌다 — 다시 그리며 놓쳤다");
    box.focus();
    box.value += ch;
    box.dispatchEvent(new win.Event("input", {bubbles: true}));
    await sleep(90);
  }
}

const rows = d => d.querySelectorAll(".tidypanel .titem").length;
const footText = d => (d.querySelector(".tidypanel .tfoot .path") || {}).textContent || "";
const overBtn = d => d.querySelector('.tidypanel [data-tidy="purgeold"]');

async function run(){
  const win = f.contentWindow, doc = f.contentDocument;
  const errs = [];
  win.addEventListener("error", e => errs.push(String(e.message)));
  win.addEventListener("unhandledrejection", e => errs.push("reject: " + e.reason));
  try{
    /* 판을 여는 전역 자리는 **Settings 레일**이다 (REQ-20260915-077-62x6).
       탭 줄에 두었다가 반려됐다 — 휴지통은 드물게 가는 곳이라 자주 가는 곳의
       줄에 서지 않는다. 재는 것은 넷이다: 탭 줄에 없는가 · Docs 목록 머리(거르개
       칩의 줄)에도 없는가 · Settings 레일에서 「저장소」 다음에 서는가 · 눌러서
       판이 뜨는가. */
    check("탭 줄에는 휴지통이 없다 — 자주 가는 곳의 줄이다",
      !doc.querySelector(".tabs #trash-chip") && !doc.querySelector(".tabs .tabsep"));
    realClick(win, doc, doc.querySelector('.tabs [data-tab="settings"]'));
    const nav = await wait(() => doc.getElementById("tidy-nav"), 20000,
      "Settings 레일의 「보관함 · 휴지통」");
    check("Settings 레일에 선다 — 드물게 여는 것들이 모인 서랍",
      !!nav.closest("#view .doclist"), (nav.querySelector("div")||{}).textContent);
    check("「저장소」 바로 다음 줄이다",
      (nav.previousElementSibling || {}).dataset?.sset === "repo",
      (nav.previousElementSibling || {}).textContent);
    check("화면을 바꾸는 절은 아니다 — sel 을 받지 않는다",
      !nav.classList.contains("sel") && !nav.hasAttribute("data-sset"));
    check("여는 것이 판이라고 말한다 — haspopup · 닫힌 상태",
      nav.getAttribute("aria-haspopup") === "dialog"
      && nav.getAttribute("aria-expanded") === "false");
    check("아이콘이 아니라 글자다 — 보이는 글자가 곧 읽어 줄 이름이다",
      /보관함 · 휴지통/.test(nav.textContent) && !nav.hasAttribute("aria-label"),
      nav.getAttribute("title"));
    const chip = nav;
    realClick(win, doc, chip);
    await wait(() => doc.querySelector(".tidypanel"), 20000, "판");
    await sleep(600);
    // 휴지통 탭으로 옮긴다 — 판은 비어 있지 않은 쪽부터 연다.
    const tab = doc.querySelector('.tidypanel [data-ttab="trash"]');
    if (tab) realClick(win, doc, tab);
    /* 목록이 **닿을 때까지** 기다린다 — 받아 오기 전의 판은 「이 목록을 받지
       못했습니다」 한 줄이라, 고정 시간만 세고 재면 느린 날에 거르개도 줄도
       없는 화면을 재게 된다(그날 이 하니스가 실제로 그렇게 어긋났다). */
    await wait(() => doc.querySelector(".tidypanel .tq") || rows(doc) > 0,
               20000, "휴지통 목록");
    await sleep(400);
    check("판이 뜨면 손잡이가 「열려 있다」고 말한다",
      chip.getAttribute("aria-expanded") === "true");
    check("그 손잡이로 연 판이 보관함·휴지통 판이다",
      !!doc.querySelector(".tidypanel .tidytabs"),
      (doc.querySelector(".tidypanel .dlgcap") || {}).textContent);
    await sleep(200);
    const n0 = rows(doc);
    const tabText = () =>
      (doc.querySelector('.tidypanel .tidytabs [data-ttab="trash"]') || {}).textContent || "";
    say(`휴지통 ${n0}건으로 시작 · 탭「${esc(tabText().trim())}」`, "hi");
    const chips = doc.querySelectorAll('.tidypanel [data-tidy="who"]').length;
    check("검색 칸이 선다", !!doc.querySelector(".tidypanel .tq"));
    /* 기록이 0건인 갈래는 세우지 않는다 — 눌러도 빈 목록인 칸은 손잡이가
       아니라 함정이다 (designer 실측). 그래서 칩은 0개이거나 3개다. */
    check("거르개는 아예 없거나 셋이다 — 눌러도 빈 칸을 그리지 않는다",
      chips === 0 || chips === 3, `칩 ${chips}개`);

    // ── 거르개 (설 때만)
    const who = v => doc.querySelector(`.tidypanel [data-tidy="who"][data-who="${v}"]`);
    if (chips === 3){
    realClick(win, doc, who("screen")); await sleep(250);
    const nScreen = rows(doc);
    check("「화면에서 버린 것」이 갈라 낸다", nScreen > 0 && nScreen < n0,
      `${n0} → ${nScreen}`);
    check("좁혀도 탭의 수는 전량 그대로다", tabText().includes(String(n0)),
      tabText().trim());

    realClick(win, doc, who("cli")); await sleep(250);
    const nCli = rows(doc);
    check("「명령으로 버린 것」이 갈라 낸다", nCli > 0 && nCli < n0, `→ ${nCli}`);
    check("두 갈래가 서로 다른 것을 집는다",
      doc.querySelector(".tidypanel .titem .tid").textContent.trim() !== "",
      doc.querySelector(".tidypanel .titem .tid").textContent.trim());

    realClick(win, doc, who("all")); await sleep(250);
    check("「전체」로 돌아오면 다시 전량이다", rows(doc) === n0, `→ ${rows(doc)}`);
    }

    /* ── 검색 (한 자씩). 칠 글자는 **첫 행의 번호**에서 얻는다 — 고정 낱말을
       박아 두면 그 문서가 사라진 날 하니스가 제품 결함처럼 실패한다. */
    const first = doc.querySelector(".tidypanel .titem .tid").textContent.trim();
    const term = first.slice(-3);
    await type(win, doc, term);
    await sleep(250);
    const nq = rows(doc);
    check("친 글자마다 목록이 좁아진다", nq > 0 && nq < n0, `→ ${nq}`);
    check("친 글자가 칸에 그대로 남는다",
      (doc.querySelector(".tidypanel .tq") || {}).value === term,
      (doc.querySelector(".tidypanel .tq") || {}).value);

    // ── 걸러서 0 인 자리
    await type(win, doc, "없는말");
    await sleep(250);
    check("0 건이면 이유를 말하고 푸는 손을 준다",
      rows(doc) === 0 && !!doc.querySelector('.tidypanel [data-tidy="clearq"]'),
      (doc.querySelector(".tidypanel .tempty") || {}).textContent?.trim().slice(0, 40));
    realClick(win, doc, doc.querySelector('.tidypanel [data-tidy="clearq"]'));
    await sleep(250);
    check("「조건 지우기」가 전량으로 되돌린다", rows(doc) === n0, `→ ${rows(doc)}`);

    // ── 바닥
    const labels = [...doc.querySelectorAll(".tidypanel .titem .acts button")]
      .map(b => b.textContent.trim());
    check("행의 되돌리는 손이 양 탭에서 「문서 목록으로」 하나다",
      labels.includes("문서 목록으로") && !labels.includes("보관 해제"),
      [...new Set(labels)].join(" · "));
    check("바닥이 한 가지만 말한다 — 번호 약속은 확인 창의 몫",
      !footText(doc).includes("번호"), footText(doc).slice(0, 40) + "…");
    /* 수명은 **넘긴 것이 있을 때만** 말한다 — 0 인데 날수를 적으면 숫자만 서고
       뒤따르는 일이 없다. 이 저장소의 지금 휴지통은 가장 오래된 것이 30일 안이라,
       0 인 쪽이 지금 볼 수 있는 모습이다. */
    const marks = doc.querySelectorAll(".tidypanel .tover").length;
    check("넘긴 것이 없으면 날수도 손잡이도 세우지 않는다",
      marks > 0 ? (!!overBtn(doc) && /완전히 지우기/.test(overBtn(doc).textContent))
                : (!overBtn(doc) && !footText(doc).includes("넘긴")),
      `넘긴 줄 ${marks}개 · 정리하기 ${overBtn(doc) ? "있음" : "없음"}`);

    check("화면이 죽지 않았다", errs.length === 0, errs.join(" | "));
  }catch(e){
    check("하니스가 끝까지 갔다", false, String(e && e.message || e));
  }
  const bad = verdicts.filter(v => !v.pass).length;
  say(`\n판정: ${verdicts.length - bad}/${verdicts.length} 통과`,
      bad ? "bad" : "ok");
}
</script></body></html>
