    <circle cx="32" cy="32" r="28.56" fill="url(#s9dome)"/>
    <ellipse cx="24.0" cy="20.58" rx="11.42" ry="7.43" fill="url(#s9lit)" transform="rotate(-22 24.0 20.58)"/>
