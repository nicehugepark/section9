  <text x="88" y="50" textLength="190" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="48"
        font-weight="700" fill="currentColor">section<tspan>9</tspan></text>
  <!-- o 의 속을 눈으로 — 글자는 건드리지 않는다 -->
  <circle cx="209.0" cy="39.0" r="5.6" fill="url(#s9dome)"/>
  <ellipse cx="207.43" cy="36.76" rx="2.24" ry="1.46" fill="url(#s9lit)" transform="rotate(-22 207.43 36.76)"/>
