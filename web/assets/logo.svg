<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 70" width="290" height="70" role="img" aria-label="section9">
  <title>section9</title>
  <style>
    /* 밝은 쪽 색은 presentation attribute 로 둔다 — 인라인 SVG 의 style 은 문서
       전체에 걸려, 한 쪽에 여러 벌이 실리면 마지막 것이 앞의 것을 덮는다. */
    @media (prefers-color-scheme:dark){.s9logo{color:#e8e8e4}}
  </style>
  <g class="s9logo" color="#141518">
  <g transform="translate(8 7) scale(0.875)">
    <rect width="64" height="64" fill="#141518"/>
    <circle cx="32" cy="32" r="23" fill="#fafaf8"/>
    <circle cx="29.2" cy="37.38" r="1.85" fill="#141518"/>
    <circle cx="34.8" cy="37.38" r="1.85" fill="#141518"/>
    <circle cx="32" cy="42.23" r="1.85" fill="#141518"/>
  </g>
  <text x="88" y="50" textLength="190" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="48"
        font-weight="700" fill="currentColor">section<tspan>9</tspan></text>
  <!-- o 의 속을 눈으로 — 글자는 건드리지 않는다 -->
  <circle cx="209.0" cy="39.0" r="5.6" fill="#fafaf8"/>
  <circle cx="207.32" cy="39.71" r="0.45" fill="#141518"/>
  <circle cx="210.68" cy="39.71" r="0.45" fill="#141518"/>
  <circle cx="209.0" cy="42.62" r="0.45" fill="#141518"/>
  <!-- 9 의 고리 속을 눈으로 -->
  <circle cx="265.2" cy="30.0" r="5.2" fill="#fafaf8"/>
  <circle cx="263.64" cy="30.66" r="0.42" fill="#141518"/>
  <circle cx="266.76" cy="30.66" r="0.42" fill="#141518"/>
  <circle cx="265.2" cy="33.36" r="0.42" fill="#141518"/>
  </g>
</svg>
