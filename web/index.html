<!-- 이 파일은 껍데기다 (REQ-20260829-027). 규칙은 web/css/, 로직은 web/app/ 에 있다.
     14,792 줄 한 장이었을 때 하루에 네 팀이 붙어 서로를 덮었다 — 한 기능을 고치려고
     남의 자리를 열어야 했기 때문이다. 이제 고칠 것이 있으면 **그 조각 하나만** 연다.

     순서가 곧 계약이다. 아래 두 `<template>` 목록은 위에서 아래로 그대로 적용·실행된다:
       · css — 뒤에 오는 것이 앞을 덮는다. overlay 가 skins 뒤인 것은 실수가 아니다.
       · app — const → … → events(boot 호출) → diag. 새 조각은 **의미로** 자리를
         고르되, 부르는 쪽보다 먼저 놓아라 (읽는 시점에 이미 있어야 한다).

     조각을 더하거나 옮길 자리는 그 `<template>` 안이다. 목록은 그 안에 있고,
     브라우저가 실제로 받는 것은 `/css/all.css`·`/app/all.js` 두 갈래다 —
     서버가 이 목록을 읽어 **같은 순서로** 이어 붙여 낸다 (REQ-20260829-039).
     template 안의 태그는 불활성이라 브라우저가 가져가지 않으므로, 선언은
     살아 있고 요청은 둘뿐이다. 목록 밖에 `<link>`·`<script>` 를 따로 놓으면
     그 조각만 두 번 돌거나(묶음 + 자기 자신) 두 벌 목록이 된다.
     새 규칙·새 로직을 여기 인라인으로 끼워 넣지 마라 — tests/test_web_split.py 가 막는다. -->
<script>
/* 잘려 온 조각을 **말하기 전에 되찾는다** (REQ-20260829-039).

   가르기가 F5 한 번을 요청 42개로 만들었고, WSL2 루프백은 그 동시 도착에서
   무너진다 — 404 가 아니라 연결이 안 선다(실측 24/42 · 12/42 · 9/42). 규칙 조각
   하나만 잘려도 레이아웃이 통째로 무너진다. 사파리만의 일이 아니다.
   실패한 것만 120·320·800ms + 지터로 다시 걸면 41/42 · 42/42 · 42/42 로 돌아온다.

   묶음(all.css·all.js)이 그 42를 2로 되돌렸지만 이 그물은 그대로 둔다 —
   묶음도 잘린다. 둘이 겹쳐야 벼랑이 사라진다.

   이 코드는 껍데기 안에, 그것도 링크보다 **먼저** 있어야 한다 — 조각으로 빼면
   자기도 잘리고, 규칙 조각은 `<head>` 에서 이미 실패하기 시작한다.
   자리는 여러 군데지만 규칙은 하나여야 해서 `onerror` 대신 캡처로 듣는다.
   계약은 tests/test_web_split.py 의 s5c·s5d 에. */
window.__S9_RETRY = {pending: 0, lost: [], on: true};
(function(){
  var B = [120, 320, 800];                   // REQ-20260829-019 이 실측한 간격
  var R = window.__S9_RETRY;
  function name(u){
    var m = /\/((?:app|css)\/[\w.-]+)/.exec(u || "");
    return m ? m[1] : (u || "");
  }
  function give(el, url){                    // 세 번 걸어도 안 오면 지킴이의 자리
    R.lost.push(name(url));
    if (window.__S9_OOPS) window.__S9_OOPS.draw();
  }
  function again(el, url){
    var n = (+el.getAttribute("data-r") || 0) + 1;
    var raw = String(url).split("?")[0];
    if (n > B.length) return give(el, raw);
    R.pending++;
    setTimeout(function(){
      R.pending--;
      var css = el.tagName === "LINK";
      if (css){
        /* 규칙은 **같은 자리에** 다시 건다. 새 <link> 를 뒤에 붙이면 "뒤에 오는
           것이 앞을 덮는다"는 이 껍데기의 계약이 그 조각만 뒤집힌다. */
        el.setAttribute("data-r", n);
        el.href = raw + "?r=" + n;
        return;
      }
      var s = document.createElement("script");
      s.async = false;                       // 되찾은 것끼리는 부른 순서대로
      s.setAttribute("data-r", n);
      s.onerror = function(){ again(s, raw); };
      s.onload = function(){ window.__S9_JS_CAME = 1; revive(); };
      s.src = raw + "?r=" + n;
      (el.parentNode || document.head).insertBefore(s, el.nextSibling);
    }, B[n - 1] * (0.75 + Math.random() * 0.5));
  }
  window.addEventListener("error", function(e){
    var t = e.target;
    if (!t || t === window) return;
    if (t.tagName === "LINK" && t.rel === "stylesheet") again(t, t.href);
    else if (t.tagName === "SCRIPT" && t.src) again(t, t.src);
  }, true);                                  // 자원 오류는 버블하지 않는다
  /* 늦게 온 로직은 **스스로 화면을 세운다.** 조각 하나가 없으면 boot() 이 그
     자리에서 죽어 판이 빈 채로 남는데, 되찾아 놓고도 사람이 F5 를 눌러야 한다면
     되찾은 것이 아니다. 판이 이미 서 있으면 건드리지 않는다. */
  var t = 0;
  function revive(){
    clearTimeout(t);
    t = setTimeout(function(){
      var v = document.getElementById("view");
      if (!v || v.children.length || typeof boot !== "function") return;
      try { boot(); } catch (err){ /* 지킴이가 말한다 */ }
    }, 60);
  }
})();
</script>
