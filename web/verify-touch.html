<p class="vnote">
  <b>손끝 과녁 44px</b> — 창을 400px 로 줄이고 보라.
  사용량 칩의 글자 줄은 12px 그대로이고, 누를 자리만 위아래로 펴져 44px 이 된다.
  주소 끝에 <b>?target</b> 을 붙이면 그 과녁이 점선으로 보인다.
  접힌 탭 줄 사이가 벌어진 것도 같은 까닭이다 — 아랫줄 탭의 과녁이 윗줄 탭의 밑동을
  먹지 않게.
</p>
